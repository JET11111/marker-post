<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marker Post · phone preview</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#C9CACF;color:#1c1c1f;font:14px system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 16px}
h1{font-size:16px;margin:0}
label{font-size:13px;display:flex;align-items:center;gap:6px}
select,input{padding:8px;border:1px solid #9a9aa2;border-radius:8px;background:#fff;font:inherit}
input{width:340px}
.frames{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
figure{margin:0}
figcaption{font-size:12px;margin:0 0 6px;color:#3a3a40}
iframe{display:block;border:0;border-radius:28px;background:#000;box-shadow:0 2px 14px rgba(0,0,0,.25)}
.note{font-size:12px;color:#3a3a40;max-width:70ch}
</style>
</head>
<body>
<header>
  <h1>Phone preview</h1>
  <label>Screen <select id="view">
    <option value="nearest">Nearest</option><option value="map">Map</option>
    <option value="signs">Signs</option><option value="goto">Go to</option><option value="vehicle">Vehicle</option>
  </select></label>
  <label>Size <select id="size">
    <option value="390,844">390 × 844</option><option value="430,932">430 × 932</option>
    <option value="375,667">375 × 667</option><option value="360,780">360 × 780</option>
  </select></label>
  <label>Simulated position <input id="sim" value="50.93795,-1.352527,110,30" spellcheck="false"></label>
  <span class="note">The real app in phone-sized frames: light, dark and landscape. The position is simulated (latitude, longitude, direction of travel, speed in m/s) and labelled as such on screen. Clear the box to use this device's real location.</span>
</header>
<div class="frames">
  <figure><figcaption>Light</figcaption><iframe id="f-light" title="Marker Post, light" allow="geolocation"></iframe></figure>
  <figure><figcaption>Dark</figcaption><iframe id="f-dark" title="Marker Post, dark" allow="geolocation"></iframe></figure>
  <figure><figcaption>Landscape (dash mount), dark</figcaption><iframe id="f-land" title="Marker Post, landscape" allow="geolocation"></iframe></figure>
</div>
<script>
const $ = (id) => document.getElementById(id);
function update() {
  const [w, h] = $('size').value.split(',').map(Number);
  const sim = $('sim').value.trim();
  const src = (theme) => `../?theme=${theme}${sim ? `&sim=${encodeURIComponent(sim)}` : ''}#${$('view').value}`;
  const set = (id, theme, width, height) => {
    const f = $(id);
    f.style.width = width + 'px'; f.style.height = height + 'px';
    f.src = src(theme);
  };
  set('f-light', 'light', w, h);
  set('f-dark', 'dark', w, h);
  set('f-land', 'dark', h, w);
}
for (const id of ['view', 'size']) $(id).addEventListener('change', update);
$('sim').addEventListener('change', update);
const params = new URLSearchParams(location.search);
if (params.get('view')) $('view').value = params.get('view');
if (params.get('sim') !== null) $('sim').value = params.get('sim');
update();
</script>
</body>
</html>
