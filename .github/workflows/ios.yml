# Checks the iPhone app without an Apple account, a Mac or any secrets:
#   * the Swift nearest-post lookup gives the same answers as the web app;
#   * the app, its plugin and the widget / Live Activity extension compile, and
#     the extension ends up inside the app;
#   * the app runs in an iPhone simulator, fed a drive along the M27, with
#     pictures kept of each step.
# Nothing here is signed for a real phone or uploaded. TestFlight is ios-testflight.yml.
name: ios

on:
  push:
    branches: [master, 'feature/**']
    paths:
      - 'ios/**'
      - 'native/**'
      - 'core/**'
      - 'vendor/**'
      - 'scripts/**'
      - '*.js'
      - '*.css'
      - 'index.html'
      # The post and junction records behind the phone's own lookup. Not all of
      # data/: the road network and the signs are refreshed by their own jobs.
      - 'data/posts.json'
      - 'data/posts-supplemental.json'
      - 'data/junctions.json'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'native/**'
      - 'core/**'
      - 'vendor/**'
      - 'scripts/**'
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'data/posts.json'
      - 'data/posts-supplemental.json'
      - 'data/junctions.json'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lookup-tests:
    name: Lookup tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Use the newest Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -viE 'beta|candidate' | sort -V | tail -n 1)"
          if [ -n "$xcode" ]; then echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"; fi
      - name: Write the post list and the expected answers from the web app's own code
        run: node scripts/build-native-data.mjs
      - run: swift --version
      - name: Run the Swift lookup against every expected answer
        working-directory: native/marker-post-plugin
        env:
          MARKERPOST_CORE_ONLY: "1"
        run: swift test

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # The Xcode 27 leg is an early warning for April 2027, when Apple will
    # require it. It is allowed to fail without failing the workflow.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Xcode 26
            runner: macos-26
            pick: "26"
            experimental: false
          - name: Xcode 27 preview
            runner: xcode-27
            pick: ""
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Choose Xcode
        if: matrix.pick != ''
        run: |
          xcode="$(ls -d /Applications/Xcode_${{ matrix.pick }}*.app 2>/dev/null | grep -viE 'beta|candidate' | sort -V | tail -n 1)"
          if [ -n "$xcode" ]; then echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"; fi
      - run: xcodebuild -version

      - name: Install the Capacitor tools
        run: npm ci --ignore-scripts
      - name: Build the web app and the lookup data for the phone
        run: npm run build:native
      # The TestFlight job runs the lookup tests at this point, in the same
      # checkout as the build it then signs. Doing the same on this leg proves
      # on every change that the two get on together, without waiting for a
      # real upload.
      - name: Lookup tests in this checkout, as the TestFlight job runs them
        if: matrix.pick == '26'
        working-directory: native/marker-post-plugin
        env:
          MARKERPOST_CORE_ONLY: "1"
        run: |
          swift --version
          swift test
      - name: Copy it into the Xcode project
        run: npx cap sync ios

      - name: The Xcode project lists every source file
        run: node scripts/ios-project.mjs --check
      # The TestFlight lane only ever runs with the signing secrets, after an
      # approval. This proves on every change that it is at least valid Ruby.
      # It reads the file and runs nothing in it.
      - name: The TestFlight lane is valid Ruby
        if: matrix.pick == '26'
        run: ruby -c ios/App/fastlane/Fastfile
      - name: One iOS version everywhere
        run: |
          grep -n 'platforms' ios/App/CapApp-SPM/Package.swift
          grep -q 'platforms: \[.iOS(.v18)\]' ios/App/CapApp-SPM/Package.swift
          grep -q 'MarkerPostNative' ios/App/CapApp-SPM/Package.swift

      - name: Fetch the Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      # A simulator build needs no Apple account: Xcode signs it "to run locally",
      # which also carries the App Group the app and its widgets share.
      - name: Build the app and the widget extension for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-simulator.log" | xcbeautify --renderer github-actions
      - name: The extension is inside the app
        run: test -d "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/App.app/PlugIns/MarkerPostWidgets.appex"

      # The nearest thing to a real iPhone that GitHub has: start the app in a
      # simulator, feed it a drive along the M27, start live tracking, and keep
      # pictures of each step. It fails on a crash; what the pictures show is for
      # a person to judge. New and still being proven, so it does not fail the build.
      - name: Run it in an iPhone simulator and take pictures
        if: matrix.pick == '26'
        continue-on-error: true
        run: node scripts/smoke-ios.mjs "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/App.app" "$RUNNER_TEMP/simulator"
      - name: Keep the pictures
        if: always() && matrix.pick == '26'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iphone-simulator
          path: ${{ runner.temp }}/simulator
          if-no-files-found: ignore
          retention-days: 14

      - name: Build for a real iPhone, as a release (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-device" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-device.log" | xcbeautify --renderer github-actions

      # The TestFlight job installs fastlane from ios/App/Gemfile.lock, so that it
      # always runs exactly the same code. There is no Ruby on the development
      # computer to write that file, so it is written here the first time and
      # offered as a download, to be committed.
      - name: Write ios/App/Gemfile.lock while the repository has none
        id: gemlock
        if: matrix.pick == '26' && hashFiles('ios/App/Gemfile.lock') == ''
        working-directory: ios/App
        run: |
          ruby --version && bundle --version
          bundle lock --add-platform ruby
          echo "made=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.gemlock.outputs.made == 'true'
        with:
          name: gemfile-lock
          path: ios/App/Gemfile.lock
          retention-days: 7

      - name: Keep the build logs when something failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcodebuild-logs-${{ matrix.pick || 'preview' }}
          path: ${{ runner.temp }}/xcodebuild-*.log
          if-no-files-found: ignore
          retention-days: 7
