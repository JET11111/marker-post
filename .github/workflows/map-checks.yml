name: map-checks
on:
  pull_request:
    paths: ['*.js', '*.css', 'index.html', 'core/**', 'data/network.json', 'data/posts.json', 'data/junctions.json', 'data/posts-supplemental.json', 'scripts/**', 'tests/**', 'vendor/**', 'package.json', '.github/workflows/map-checks.yml']
  push:
    branches: ['feature/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The app itself has no dependencies; the native build needs the Capacitor runtime.
      - run: npm ci --ignore-scripts
      - run: node --test tests/*.test.mjs
      - run: node scripts/fetch-network.mjs --validate
      - run: node scripts/check.mjs
      - run: python3 -m py_compile scripts/fetch-supplemental-posts.py
